name: spp

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: spp-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:?missing}:${POSTGRES_PASSWORD:?missing}@db:5432/${POSTGRES_DB:?missing}
      NEXTAUTH_URL: https://${DOMAIN:?missing}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?missing}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    expose:
      - "3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?missing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing}
      POSTGRES_DB: ${POSTGRES_DB:?missing}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?missing}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - app
    networks:
      - internal

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?missing}
      PGPASSWORD: ${POSTGRES_PASSWORD:?missing}
      PGDATABASE: ${POSTGRES_DB:?missing}
      BACKUP_RETENTION_DAYS: "30"
    volumes:
      - ./backup:/backup
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache coreutils >/dev/null 2>&1 || true
        while true; do
          /scripts/backup.sh || echo "[backup] run failed at $$(date -Iseconds)";
          sleep 86400;
        done
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  pg_data:
  caddy_data:
  caddy_config:
  caddy_logs:

networks:
  internal:
    driver: bridge
