name: spp

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: spp-app:latest
    restart: unless-stopped
    # Batasi memori supaya upload/restore besar tidak membuat seluruh VPS OOM
    # (server ini juga menjalankan app lain). Pemakaian normal ±250 MB.
    mem_limit: 1536m
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:?missing}:${POSTGRES_PASSWORD:?missing}@db:5432/${POSTGRES_DB:?missing}
      NEXTAUTH_URL: https://${DOMAIN:?missing}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?missing}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    ports:
      - "127.0.0.1:3737:3000"
    volumes:
      - spp_uploads:/app/data/uploads

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?missing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing}
      POSTGRES_DB: ${POSTGRES_DB:?missing}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - internal

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?missing}
      PGPASSWORD: ${POSTGRES_PASSWORD:?missing}
      PGDATABASE: ${POSTGRES_DB:?missing}
      BACKUP_RETENTION_DAYS: "30"
    volumes:
      - ./backup:/backup
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache coreutils >/dev/null 2>&1 || true
        while true; do
          /scripts/backup.sh || echo "[backup] run failed at $$(date -Iseconds)";
          sleep 86400;
        done
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  pg_data:
  spp_uploads:

networks:
  internal:
    driver: bridge
