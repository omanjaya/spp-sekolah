# ⚠ HANYA untuk development lokal. JANGAN dijalankan di server produksi:
#   secret di bawah ini sudah publik di GitHub, DB memakai spp/spp.
#
# Development compose — hot reload via bind-mount + named volume for node_modules.
# Ports are intentionally non-mainstream to avoid collision with local services.
#
# Start:   docker compose -f docker-compose.dev.yml up -d
# Logs:    docker compose -f docker-compose.dev.yml logs -f app
# Shell:   docker compose -f docker-compose.dev.yml exec app sh
# Stop:    docker compose -f docker-compose.dev.yml down
# Reset:   docker compose -f docker-compose.dev.yml down -v   # wipes DB + node_modules cache

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: spp-dev-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3737:3000" # host:container — localhost saja (Docker bypass UFW)
    environment:
      DATABASE_URL: "postgresql://spp:spp@db:5432/spp?schema=public&connection_limit=20&pool_timeout=10"
      PRISMA_SLOW_QUERY_MS: "500"
      NEXTAUTH_URL: "http://localhost:3737"
      NEXTAUTH_SECRET: "dev-secret-please-change-in-production-abcdef123456"
      SEED_SUPERADMIN_PASSWORD: "ChangeMe-SuperAdmin-2026!"
      SEED_BENDAHARA_PASSWORD: "ChangeMe-Bendahara-2026!"
      NODE_ENV: development
      LOG_LEVEL: debug
      NODE_OPTIONS: "--max-old-space-size=2048"
      # macOS bind-mount file watching
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      # Bind-mount source for hot reload
      - .:/app
      # Keep node_modules inside the container (Linux-native, not host)
      - spp_node_modules:/app/node_modules
      # Keep .next cache inside container too (avoid host cross-OS weirdness)
      - spp_next_cache:/app/.next
    command: >
      sh -c "
      echo '[boot] applying migrations...' &&
      npx prisma migrate deploy &&
      echo '[boot] seeding (idempotent)...' &&
      npx tsx prisma/seed.ts &&
      echo '[boot] starting next dev...' &&
      exec npx next dev --turbopack -p 3000 -H 0.0.0.0
      "
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  db:
    image: postgres:16-alpine
    container_name: spp-dev-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432" # localhost saja; akses dari laptop via SSH tunnel
    environment:
      POSTGRES_USER: spp
      POSTGRES_PASSWORD: spp
      POSTGRES_DB: spp
    volumes:
      - spp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "spp", "-d", "spp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  spp_pg_data:
  spp_node_modules:
  spp_next_cache:
